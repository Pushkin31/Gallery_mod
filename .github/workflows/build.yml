name: Build Custom APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "SIGNING_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${GITHUB_WORKSPACE}/release.keystore"

      - name: Build signed release (arm64-v8a)
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
        run: ./gradlew :app:assembleFossRelease -PABI_FILTERS=arm64-v8a

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Fossify-Gallery-Custom-signed-arm64
          path: app/build/outputs/apk/foss/release/*foss-release*.apk

      - name: Cleanup keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/release.keystore"
